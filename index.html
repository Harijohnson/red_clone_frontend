<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vite-app</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- runtime env config will be injected here when deploying -->
    <script>
      (function () {
        // If a static env-config.js exists (deployed), load it before the app
        var s = document.createElement('script')
        s.src = '/env-config.js'
        s.defer = true
        document.head.appendChild(s)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
